<script>
window.drawShape = function () {
  console.log("描画開始");

  const raw = document.getElementById("rawInput").value;
  const canvas = document.getElementById("shapeCanvas");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#000";

  // =========================
  // コマンド解析（PU / PD / BZ1）
  // =========================
  const regex = /(PU|PD|BZ1),?([-0-9,]*)/g;
  let match;

  const commands = [];

  while ((match = regex.exec(raw)) !== null) {
    const cmd = match[1];
    const nums = match[2]
      ? match[2].split(",").map(Number).filter(n => !isNaN(n))
      : [];

    const pts = [];
    for (let i = 0; i < nums.length - 1; i += 2) {
      pts.push({ x: nums[i], y: nums[i + 1] });
    }

    commands.push({ cmd, pts });
  }

  if (commands.length === 0) {
    alert("座標データが見つかりません");
    return;
  }

  // =========================
  // スケール計算
  // =========================
  const allX = [], allY = [];

  commands.forEach(c => {
    c.pts.forEach(p => {
      allX.push(p.x);
      allY.push(p.y);
    });
  });

  const minX = Math.min(...allX);
  const maxX = Math.max(...allX);
  const minY = Math.min(...allY);
  const maxY = Math.max(...allY);

  const pad = 20;

  const width = (maxX - minX) || 1;
  const height = (maxY - minY) || 1;

  const scale = Math.min(
    (canvas.width - pad * 2) / width,
    (canvas.height - pad * 2) / height
  );

  // =========================
  // 描画
  // =========================
  ctx.beginPath();

  let penDown = false;
  let prev = null;

  const DIST_THRESHOLD = 25; // ←調整可能

  commands.forEach(({ cmd, pts }) => {
    pts.forEach((p) => {
      const x = pad + (p.x - minX) * scale;
      const y = pad + (maxY - p.y) * scale;

      if (cmd === "PU") {
        ctx.moveTo(x, y);
        penDown = false;
      } else {
        if (!prev || !penDown) {
          ctx.moveTo(x, y);
        } else {
          const dx = x - prev.x;
          const dy = y - prev.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist > DIST_THRESHOLD) {
            ctx.moveTo(x, y); // ←遠すぎたら分断
          } else {
            ctx.lineTo(x, y);
          }
        }
        penDown = true;
      }

      prev = { x, y };
    });
  });

  ctx.stroke();
};
</script>
